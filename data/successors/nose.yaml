deadPackage: nose
ecosystem: pypi
# No formal deprecation date exists; the docs note announced maintenance mode
# without a dated deprecation, so this is null per the schema rules.
deprecatedSince: null
successors:
  - name: pytest
    repoUrl: https://github.com/pytest-dev/pytest
    type: different-approach
    migrationEffort: minor-changes
    evidence:
      - "nose's own documentation front page (nose.readthedocs.io) says: \"Nose has been in maintenance mode for the past several years and will likely cease without a new person/team to take over maintainership. New projects should consider using Nose2, py.test, or just plain unittest/unittest2.\""
      - nose's last PyPI release is 1.3.7, uploaded 2015-06-02; zero releases since
      - "pytest publishes \"Development Status :: 6 - Mature\" on PyPI; 7 releases in the 12 months to 2026-07-14, latest 9.1.1 uploaded 2026-06-19"
      - pytest repository active as of 2026-07-14 (last push same day)
    lastVerified: 2026-07-14
notes: >-
  nose does not run on modern Python versions and its docs point users away
  from it. nose2 (github.com/nose-devs/nose2) is the community continuation
  named in the same notice, but pytest is where the ecosystem consolidated;
  pytest can collect unittest-style tests, and typical nose suites need
  localized edits (fixtures/plugins) rather than a rewrite.
