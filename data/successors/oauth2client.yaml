deadPackage: oauth2client
ecosystem: pypi
# The README deprecation note is undated; null per schema rules.
deprecatedSince: null
successors:
  - name: google-auth
    repoUrl: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-auth
    type: official-successor
    migrationEffort: minor-changes
    evidence:
      - "oauth2client's own README states: \"oauth2client is now deprecated. No more features will be added to the libraries and the core team is turning down support. We recommend you use google-auth and oauthlib.\" It links a dedicated migration guide (google-auth.readthedocs.io/en/latest/oauth2client-deprecation.html)"
      - "oauth2client publishes \"Development Status :: 7 - Inactive\" on PyPI — the registry's explicit inactive marker"
      - oauth2client's GitHub repository is archived (last push 2019-11-01); last release 4.1.3 uploaded 2018-09-07
      - google-auth shipped 25 releases in the 12 months to 2026-07-14; latest 2.56.0 uploaded 2026-07-13
    lastVerified: 2026-07-14
notes: >-
  google-auth (published by the same Google APIs team) covers credentials and
  transport; the deprecation notice also points to oauthlib for OAuth flows
  that oauth2client used to handle itself. Note google-auth's development
  moved into the googleapis/google-cloud-python monorepo — the old standalone
  repository (googleapis/google-auth-library-python) is archived with a
  pointer, which is a repo relocation, not an abandonment signal.
