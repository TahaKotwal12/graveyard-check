deadPackage: node-sass
ecosystem: npm
deprecatedSince: 2020-10-26
successors:
  - name: sass
    repoUrl: https://github.com/sass/dart-sass
    type: official-successor
    migrationEffort: drop-in
    evidence:
      - Sass team's official recommendation; node-sass's own npm deprecation message says to use sass or sass-embedded
      - Sass blog states migration is "just replace node-sass with sass" since both expose the same JavaScript API
      - 23 stable npm releases in the 12 months to 2026-07-11; latest 1.101.0 published 2026-06-11
      - Repository active as of July 2026 (last push 2026-07-10)
    lastVerified: 2026-07-11
  - name: sass-embedded
    repoUrl: https://github.com/sass/embedded-host-node
    type: official-successor
    migrationEffort: drop-in
    evidence:
      - Named alongside sass in node-sass's own npm deprecation message
      - Maintained by the Sass team; same API as sass, backed by the compiled Dart VM for faster large builds
      - Latest 1.100.0 published 2026-05-22
    lastVerified: 2026-07-11
notes: >-
  LibSass and Node Sass were officially deprecated by the Sass team on
  2020-10-26 (sass-lang.com/blog/libsass-is-deprecated). Node Sass was declared
  end-of-life on 2024-07-24, its npm package marked deprecated and the GitHub
  repository archived (sass-lang.com/blog/node-sass-is-end-of-life). Last
  node-sass release is 9.0.0 (July 2024).
