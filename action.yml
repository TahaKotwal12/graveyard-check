name: 'Lifeboat'
description: 'Scan dependencies for abandoned packages and get recommended, verified successors'
branding:
  icon: 'life-buoy'
  color: 'orange'

inputs:
  fail-on:
    description: >-
      Severity threshold that fails the build: "likely-abandoned" (default)
      fails only on likely-abandoned dependencies, "at-risk" also fails on
      at-risk dependencies.
    required: false
    default: 'likely-abandoned'
  github-token:
    description: >-
      GitHub token used for API requests (raises the rate limit). Defaults to
      the workflow's automatic token.
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Run lifeboat scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # When this action runs from a checkout of the lifeboat repo itself
        # (dogfooding), use the locally built CLI; otherwise fetch from npm.
        if [ -f "$GITHUB_ACTION_PATH/dist/cli.js" ]; then
          node "$GITHUB_ACTION_PATH/dist/cli.js" scan --json > lifeboat-report.json
        else
          npx --yes lifeboat scan --json > lifeboat-report.json
        fi

    - name: Summarize results and enforce threshold
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: node "$GITHUB_ACTION_PATH/scripts/action-summary.mjs" lifeboat-report.json
